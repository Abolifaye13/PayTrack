
services:
  postgres:
    image: postgres:16
    container_name: paytrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paytrack
      POSTGRES_PASSWORD: paytrack123
      POSTGRES_DB: paytrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paytrack -d paytrack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
