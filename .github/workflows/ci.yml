
name: PayTrack CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: customer-crud-gstin/pom.xml

      - name: Set up Maven wrapper permissions
        run: chmod +x mvnw
        working-directory: customer-crud-gstin

      - name: Build and run tests with MySQL Testcontainers
        run: ./mvnw clean verify
        working-directory: customer-crud-gstin
